spring.application.name=kvstore
server.port=8080

# Virtual threads carry every request, including the ones that block on a peer forwarding
# call (see cluster/PeerClient) - see README "why virtual threads" for the full reasoning.
spring.threads.virtual.enabled=true

# Query parameters (the key encoding) must decode as UTF-8, not the platform default.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

kvstore.segments=16
kvstore.limits.max-key-length=512
kvstore.limits.max-value-length=1048576
kvstore.limits.max-entries-per-node=1000000

management.endpoints.web.exposure.include=health,info
# Kubernetes-style liveness/readiness split (exposes /actuator/health/liveness and /readiness).
management.endpoint.health.probes.enabled=true
